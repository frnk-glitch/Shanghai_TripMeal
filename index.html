<!-- 선택: 텐센트 위치서비스 키 (config.js, git 미포함). 있으면 고품질 검색, 없으면 OSM 폴백 -->

<script>
/* ============================================================

const PLACES = [
  // --- 훠궈·마라 ---

  { cat:"hotpot", ic:"🔥", by:"소윤", name:"얼훠궈 (二火锅)", cn:"二火锅(上海店) · 南京东路·铂金万澳酒店 정문 옆", lat:31.23624, lng:121.474178, price:"¥137/人", note:"현지인 많음 · 새벽 2시까지", amap:"https://surl.amap.com/F8042q14bbz" },
  { cat:"hotpot", ic:"🔥", by:"소윤", name:"가오라오지우 훠궈 (高老九火锅)", cn:"重庆高老九火锅(上海旗舰店) · 九江路399号华盛大厦2楼", lat:31.237721, lng:121.477986, price:"¥112/人", note:"충칭훠궈 · 개구리/돼지뇌 추가 가능", amap:"https://surl.amap.com/1MHIqARrEcDQ", blog:"https://blog.naver.com/gaonzzz/224315632046" },
  { cat:"hotpot", ic:"🌶️", by:"소윤", name:"레드립스 串串香 (红唇串串香)", cn:"红唇串串香 REDLIPS(宏伊国际广场店) · 南京东路299号B1", lat:31.238948, lng:121.480073, price:"¥38/人", note:"★강추 마라 串串香 · 야식 OK", amap:"https://surl.amap.com/1fW8tEDnJ8wU", blog:"https://blog.naver.com/seosu13/224318134239" },

  // --- 면·국수 ---
  { cat:"noodle", ic:"🍜", by:"유명", name:"후시 라오룽탕 면관 (沪西老弄堂面馆)", cn:"沪西老弄堂面馆 · 静安区北京西路1738号", lat:31.226968, lng:121.438461, price:"", note:"파기름 국수(葱油拌面)로 유명한 로컬 면집", amap:"https://uri.amap.com/search?keyword=%E6%B2%AA%E8%A5%BF%E8%80%81%E5%BC%84%E5%A0%82%E9%9D%A2%E9%A6%86&city=%E4%B8%8A%E6%B5%B7&coordinate=gaode&callnative=1" },

  // --- 만두·딤섬·생전 ---
  { cat:"dumpling", ic:"🥟", by:"소윤", name:"동베이 만두 (东北四季饺子王)", cn:"东北四季饺子王(徐汇店) · 淮海中路1791号", lat:31.207008, lng:121.435395, price:"¥58/人", note:"동북요리 · 만두", amap:"https://surl.amap.com/1p0ChjlzNbm2" },
  { cat:"dumpling", ic:"🥟", by:"소윤", name:"점도덕 딤섬 (点都德)", cn:"点都德(中海环宇荟店) · 新天地", lat:31.21347, lng:121.471815, price:"", note:"딤섬 맛집 · 신천지", amap:"https://surl.amap.com/tP1VHY10fo0" },
  { cat:"dumpling", ic:"🥟", by:"유명", name:"따후춘 생전 (大壶春)", cn:"大壶春(云南南路店) · 黄浦区云南南路71号", lat:31.229395, lng:121.476489, price:"", note:"상하이식 생전(生煎) · 빕구르망 계열", amap:"https://uri.amap.com/search?keyword=%E5%A4%A7%E5%A3%B6%E6%98%A5&city=%E4%B8%8A%E6%B5%B7&coordinate=gaode&callnative=1" },
  { cat:"dumpling", ic:"🥟", by:"유명", name:"라이라이 샤오롱 (来来小笼)", cn:"来来小笼(莱莱小笼·福建中路店) · 黄浦区福建中路", lat:31.236257, lng:121.476989, price:"", note:"샤오롱바오로 많이 찾는 곳", amap:"https://uri.amap.com/search?keyword=%E6%9D%A5%E6%9D%A5%E5%B0%8F%E7%AC%BC&city=%E4%B8%8A%E6%B5%B7&coordinate=gaode&callnative=1" },

  // --- 대표요리 ---
  { cat:"signature", ic:"🐟", by:"소윤", name:"강변성외 카오위 (江边城外烤全鱼)", cn:"江边城外烤全鱼(长宁龙之梦店) · 长宁路1018号6楼", lat:31.220995, lng:121.412579, price:"¥104/人", note:"구운 생선(烤鱼)", amap:"https://surl.amap.com/tYdSZg1jgbg" },
  { cat:"signature", ic:"🦆", by:"소윤", name:"예상하이 (夜上海)", cn:"夜上海(新天地) · 湖滨路168号无限极荟307", lat:31.222591, lng:121.473313, price:"¥193/人", note:"북경오리 · 미슐랭 · 신천지", amap:"https://surl.amap.com/1DOOgePfKc8x" },
];

const CATEGORIES = {
  hotpot:    { label:"훠궈·마라",        color:"#e5484d" },
  noodle:    { label:"면·국수",          color:"#e8950c" },
  dumpling:  { label:"만두·딤섬·생전",   color:"#d6a51a" },
  signature: { label:"대표요리",         color:"#9a5cf0" },
};

/* 퀵버튼: 누르면 현재 지도 범위에서 검색해 🍴 마커로 표시 (n=한글, k=중국어 검색어) */
const MENUS = [
  {n:"★ 훠궈", k:"火锅"}, {n:"★ 카오위", k:"烤鱼"}, {n:"마라롱샤", k:"小龙虾"},
  {n:"게살국수", k:"蟹粉面"}, {n:"파기름국수", k:"葱油拌面"}, {n:"샤오롱바오", k:"小笼包"},
  {n:"생전(生煎)", k:"生煎"}, {n:"북경오리", k:"北京烤鸭"}, {n:"딤섬", k:"点心"},
  {n:"양꼬치", k:"羊肉串"}, {n:"동베이", k:"东北菜"}, {n:"밥집", k:"家常菜"},
];
const FAMOUS_SEARCH = [
  {n:"아랑면관", k:"阿郎面馆"}, {n:"푸마오 마라롱샤", k:"复茂小龙虾"},
  {n:"위싱지(게살국수)", k:"蟹黄面 外滩"}, {n:"슈다샤 훠궈", k:"蜀大侠火锅"},
  {n:"홍쿠이지아(마라롱샤)", k:"洪奎家 小龙虾"},
];
const CHAINS = [
  {n:"양꼬치", k:"很久以前羊肉串"}, {n:"릴리안 에그타르트", k:"莉莲蛋挞"},
  {n:"CHAGEE 밀크티", k:"霸王茶姬"}, {n:"코코 밀크티", k:"CoCo都可"}, {n:"하이디라오", k:"海底捞"},
];

/* ============================================================
 * WGS-84 → GCJ-02 변환 (중국 지도 오프셋 보정)
 * ============================================================ */
const GCJ = (() => {
  const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
  const outOfChina = (lat, lng) => lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
  function tLat(x, y) {
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
    r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
    return r;
  }
  function tLng(x, y) {
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
    r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
    return r;
  }
  function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return [lat, lng];
    let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
    const radLat = lat / 180 * PI;
    let magic = Math.sin(radLat); magic = 1 - EE * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180) / (A / sqrtMagic * Math.cos(radLat) * PI);
    return [lat + dLat, lng + dLng];
  }
  return { wgs2gcj };
})();

/* ============================================================
 * 지도 (Leaflet + 고덕 타일, 둘 다 GCJ-02)
 * ============================================================ */
const amapRoad = L.tileLayer(
  "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
  { subdomains: "1234", maxZoom: 18, attribution: "© AMap (高德地图)" });
const amapSat = L.layerGroup([
  L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", { subdomains:"1234", maxZoom:18, attribution:"© AMap (高德地图)" }),
  L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", { subdomains:"1234", maxZoom:18 }),
]);
const map = L.map("map", { center: [31.2304, 121.4737], zoom: 13, layers: [amapRoad] });
L.control.layers({ "고덕 일반": amapRoad, "고덕 위성": amapSat }, null, { position:"topright" }).addTo(map);
L.control.scale({ imperial:false }).addTo(map);

/* 이모지 배지 핀 */
function emojiPin(color, ic, small) {
  const s = small ? " sr" : "";
  return L.divIcon({
    className: "",
    html: `<div class="mk${s}"><div class="head" style="background:${color}">${ic}</div><div class="tail" style="border-top-color:${color}"></div></div>`,
    iconSize: small ? [28,36] : [32,41],
    iconAnchor: small ? [14,36] : [16,41],
    popupAnchor: [0, small ? -33 : -38],
  });
}

/* 고정 마커 + 사이드바 목록 */
const markers = [];
const listEl = document.getElementById("placeList");
for (const [key, cat] of Object.entries(CATEGORIES)) {
  const items = PLACES.filter(p => p.cat === key);
  if (!items.length) continue;
  const title = document.createElement("div");
  title.className = "cat-title";
  title.innerHTML = `<span class="cat-dot" style="background:${cat.color}"></span>${cat.label}`;
  listEl.appendChild(title);

  for (const p of items) {
    p.gcj = GCJ.wgs2gcj(p.lat, p.lng);
    const m = L.marker(p.gcj, { icon: emojiPin(cat.color, p.ic) }).addTo(map);
    const links = [
      p.amap ? `<a href="${p.amap}" target="_blank" rel="noopener">고덕 길찾기 ›</a>` : "",
      p.blog ? `<a href="${p.blog}" target="_blank" rel="noopener">블로그 ›</a>` : "",
    ].filter(Boolean).join(" · ");
    const badge = p.by === "소윤" ? `<span class="badge soyun">소윤★</span>` : `<span class="badge famous">유명</span>`;
    m.bindPopup(
      `<div class="cn">${p.cn}</div>${p.name} ${badge}` +
      `<div class="note">${[p.price, p.note].filter(Boolean).join(" · ")}</div>` +
      (links ? `<div class="note">${links}</div>` : "")
    );
    m.bindTooltip(p.name, { direction:"top", offset:[0,-34] });
    m._gcj = p.gcj;
    markers.push(m);

    const row = document.createElement("div");
    row.className = "place";
    row.innerHTML = `${p.ic} ${p.name} ${badge}<div class="cn">${p.cn}</div>` +
      (p.price ? `<div class="meta">${p.price}</div>` : "");
    row.onclick = () => { collapseSheet(); map.flyTo(p.gcj, 16); m.openPopup(); };
    listEl.appendChild(row);
  }
}
if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.12));

/* ============================================================
 * 퀵버튼 → 현재 지도 범위에서 검색 → 🍴 마커 플롯 (OSM Nominatim, 키 불필요)
 * 결과 없으면 고덕 검색 링크 노출. 고덕은 항상 한 탭 거리.
 * ============================================================ */
const searchLayer = L.layerGroup().addTo(map);
const plotBar = document.getElementById("plotBar");
function clearPlot() { searchLayer.clearLayers(); plotBar.style.display = "none"; }

// 텐센트 JSONP (키 있을 때만 사용)
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 8000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    s.src = url + "&output=jsonp&callback=" + cb;
    document.body.appendChild(s);
  });
}

const FOOD_TYPES = ["restaurant", "fast_food", "cafe", "bar", "food_court", "pub"];

function plotResults(label, list, amapUrl) {
  if (!list.length) {
    plotBar.innerHTML = `<span>'${label}' 결과 없음 →</span> <a href="${amapUrl}" target="_blank" rel="noopener">고덕에서 검색 ↗</a> <button id="plotClear">닫기</button>`;
    document.getElementById("plotClear").onclick = clearPlot; return;
  }
  const pts = [];
  for (const r of list) {
    pts.push(r.gcj);
    const nav = `https://uri.amap.com/marker?position=${r.gcj[1]},${r.gcj[0]}&name=${encodeURIComponent(r.title)}&coordinate=gaode&callnative=1`;
    searchLayer.addLayer(
      L.marker(r.gcj, { icon: emojiPin("#12b5a5", "🍴", true) })
       .bindPopup(`<div class="cn">${r.title}</div>${r.addr ? `<div class="note">${r.addr}</div>` : ""}<div class="note"><a href="${nav}" target="_blank" rel="noopener">고덕 길찾기 ›</a></div>`)
    );
  }
  map.fitBounds(L.latLngBounds(pts).pad(0.25));
  plotBar.innerHTML = `<span>'${label}' ${list.length}곳</span> <a href="${amapUrl}" target="_blank" rel="noopener">고덕 ↗</a> <button id="plotClear">지우기</button>`;
  document.getElementById("plotClear").onclick = clearPlot;
}

async function quickSearch(label, keyword) {
  clearPlot();
  plotBar.style.display = "flex";
  plotBar.innerHTML = `<span>'${label}' 검색 중…</span>`;
  const amapUrl = `https://uri.amap.com/search?keyword=${encodeURIComponent(keyword)}&city=${encodeURIComponent("上海")}&coordinate=gaode&callnative=1`;
  const c = map.getCenter();

  // 1) 텐센트 (키 있으면 — 고품질, 좌표 GCJ-02 그대로)
  if (window.TENCENT_KEY) {
    try {
      const d = await jsonp(`https://apis.map.qq.com/ws/place/v1/search?keyword=${encodeURIComponent(keyword)}` +
        `&boundary=${encodeURIComponent(`nearby(${c.lat},${c.lng},6000,1)`)}&page_size=15&key=${window.TENCENT_KEY}`);
      if (d.status === 0 && d.data && d.data.length) {
        plotResults(label, d.data.map(p => ({ title: p.title, addr: p.address || "", gcj: [p.location.lat, p.location.lng] })), amapUrl);
        collapseSheet(); return;
      }
    } catch (e) { /* OSM 폴백 */ }
  }

  // 2) OSM Nominatim 폴백 (키 불필요, WGS-84 → GCJ 보정 · 음식점/이름일치만)
  let results = [];
  try {
    const b = map.getBounds().pad(0.05);
    const vb = `${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
    const res = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=20&accept-language=zh,ko,en" +
      `&bounded=1&viewbox=${vb}&q=${encodeURIComponent(keyword)}`);
    const arr = await res.json();
    results = (Array.isArray(arr) ? arr : [])
      .filter(r => FOOD_TYPES.includes(r.type) || (r.name || "").includes(keyword) || (r.display_name || "").split(",")[0].includes(keyword))
      .map(r => ({ title: (r.display_name || "").split(",")[0], addr: (r.display_name || "").split(",").slice(1, 4).join(", "), gcj: GCJ.wgs2gcj(+r.lat, +r.lon) }));
  } catch (e) { /* 고덕 링크로 */ }
  plotResults(label, results, amapUrl);
  collapseSheet();
}

function renderQuick(gridId, items) {
  const grid = document.getElementById(gridId);
  for (const it of items) {
    const btn = document.createElement("button");
    btn.className = "chain-btn";
    btn.innerHTML = `${it.n}<span class="cn">${it.k}</span>`;
    btn.onclick = () => quickSearch(it.n, it.k);
    grid.appendChild(btn);
  }
}
renderQuick("menuGrid", MENUS);
renderQuick("famousGrid", FAMOUS_SEARCH);
renderQuick("chainGrid", CHAINS);

/* 모바일 바텀시트 */
const sidebarEl = document.getElementById("sidebar");
const isMobile = () => window.matchMedia("(max-width: 700px)").matches;
document.getElementById("sheetHandle").onclick = () => sidebarEl.classList.toggle("expanded");
function collapseSheet() { if (isMobile()) sidebarEl.classList.remove("expanded"); }
map.on("click", collapseSheet);
</script>
